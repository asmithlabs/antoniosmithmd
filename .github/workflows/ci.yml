name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3', bundler-cache: true }
      - name: Brakeman (fails on medium/high)
        run: bin/brakeman --no-pager -q -w2
      - name: Gem vulnerabilities
        run: bin/bundler-audit check --update

  smoke:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: production
      SECRET_KEY_BASE: ci-only-not-a-secret-ci-only-not-a-secret-ci-only-not-a-secret-0123456789
      ADMIN_PASSWORD: ci-password
      APP_ORIGIN: http://localhost:3000
      RAILS_FORCE_SSL: "false"
      RAILS_ASSUME_SSL: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3', bundler-cache: true }
      - name: Prepare database and seed drafts
        run: bin/rails db:prepare && bin/rails db:seed
      - name: Mermaid diagrams
        run: bin/rails runner script/smoke/mermaid_block.rb
      - name: Boot and load every page
        run: |
          bin/rails runner 'Post.first.update!(published_at: 1.hour.ago)'
          bin/rails server -p 3000 -d && sleep 8
          slug=$(bin/rails runner 'puts Post.published.first.slug' 2>/dev/null | tail -n1)
          for u in / /blog /projects /graph /graph.json /search "/search?q=draft" /blog/$slug /feed.xml /sitemap.xml /robots.txt /admin/login /up /js/vendor/mermaid-11.17.2.min.js; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$u")
            echo "$u $code"; [ "$code" = 200 ] || exit 1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/admin/posts)
          echo "/admin/posts (signed out) $code"; [ "$code" = 302 ] || exit 1
      - name: Image upload accepts a PNG and refuses an SVG
        run: |
          token=$(bin/rails runner 'puts ApiToken.create!(name: "ci", scope: "draft").plaintext' 2>/dev/null | tail -n1)
          printf 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGNgYGD4DwABBAEAwS2OUAAAAABJRU5ErkJggg==' | base64 -d > /tmp/one.png
          printf '<svg xmlns="http://www.w3.org/2000/svg"><script>alert(1)</script></svg>' > /tmp/bad.svg
          url=$(curl -s -H "Authorization: Bearer $token" -F file=@/tmp/one.png http://localhost:3000/api/v1/uploads | ruby -rjson -e 'puts JSON.parse(STDIN.read)["url"]')
          echo "uploaded: $url"; [ -n "$url" ] || exit 1
          type=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "http://localhost:3000$url")
          echo "fetch: $type"; [ "$type" = "200 image/png" ] || exit 1
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" -F 'file=@/tmp/bad.svg;type=image/png;filename=x.png' http://localhost:3000/api/v1/uploads)
          echo "svg dressed as png: $code"; [ "$code" = 422 ] || exit 1
          code=$(curl -s -o /dev/null -w '%{http_code}' -F file=@/tmp/one.png http://localhost:3000/api/v1/uploads)
          echo "no token: $code"; [ "$code" = 401 ] || exit 1
          code=$(curl -s -o /dev/null -w '%{http_code}' -F file=@/tmp/one.png http://localhost:3000/admin/uploads)
          echo "admin endpoint, signed out: $code"; [ "$code" = 422 ] || [ "$code" = 302 ] || exit 1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Docker image builds
        run: docker build -t antoniosmithmd:ci .
