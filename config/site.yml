name: "Antonio Smith, MD"
tagline: "Hospitalist · Clinical informatics · Indianapolis"
intro: |
  I'm a physician based in Indianapolis, where I work as a hospitalist and train in clinical informatics at Regenstrief Institute.

  Outside of clinical work, my interests include programming, research, and technology. I work on a variety of projects, some related to medicine and others simply because I find them interesting.

  I use this site to share my writing, document projects, and keep notes on things I'm working on.
hospitalist: |
  Board-certified internist and hospitalist since 2020 at Good Samaritan Hospital
  in Vincennes, IN, including two years as hospital medical director. I also teach
  IM residents and PA students as an adjunct clinical professor.
informatics: |
  Clinical Informatics Fellow at Regenstrief Institute / Indiana University.
  Current work: AI risk categorization and governance, generative-AI prompt design
  for patient messaging in Epic, computational phenotyping for heat-related
  illness, and healthcare sustainability informatics.
education: |
  MD · MBA, Indiana University Kelley School of Business ·
  Clinical Informatics Fellowship, Regenstrief Institute / IU
